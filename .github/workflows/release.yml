name: Release to npm

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Clean ~/.npmrc
        run: |
          rm -f ~/.npmrc
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "❌ Tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "✅ Tag matches package version"

      - name: Build
        run: npm run build

      - name: Publish to npm (OIDC / Trusted Publisher)
        run: npm publish --access public
